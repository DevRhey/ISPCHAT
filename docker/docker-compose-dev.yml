# Backend local em Node 20 (exigência Baileys 7) + Postgres/Redis já existentes
services:
  backend:
    image: node:20-bookworm-slim
    container_name: whaticket-backend
    working_dir: /app
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ../backend:/app
      - backend_node_modules:/app/node_modules
    environment:
      - NODE_ENV=development
      - BACKEND_URL=http://localhost:8080
      - FRONTEND_URL=http://localhost:3000
      - PROXY_PORT=8080
      - PORT=8080
      - DB_DIALECT=postgres
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=whaticket
      - DB_PASS=whaticket
      - DB_NAME=whaticket
      - JWT_SECRET=kZaOTd+YZpjRUyyuQUpigJaEMk4vcW4YOymKPZX0Ts8=
      - JWT_REFRESH_SECRET=dBSXqFg9TaNUEDXVp6fhMTRLBysP+j2DSqf7+raxD3A=
      - REDIS_URI=redis://:whaticket@redis:6379
      - REDIS_OPT_LIMITER_MAX=1
      - REDIS_OPT_LIMITER_DURATION=3000
      - USER_LIMIT=10000
      - CONNECTIONS_LIMIT=100000
      - CLOSED_SEND_BY_ME=true
    command: >
      bash -c "apt-get update -qq && apt-get install -y -qq git python3 make g++ ffmpeg > /dev/null
      && npm install --no-audit --no-fund
      && npm run build
      && node --max-old-space-size=4096 dist/server.js"
    depends_on:
      - postgres
      - redis
    networks:
      - whaticket-network

  postgres:
    image: postgres:14-alpine
    container_name: whaticket-postgres
    restart: always
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=whaticket
      - POSTGRES_PASSWORD=whaticket
      - POSTGRES_DB=whaticket
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - whaticket-network

  redis:
    image: redis:6-alpine
    container_name: whaticket-redis
    restart: always
    ports:
      - "6379:6379"
    command: redis-server --requirepass whaticket
    volumes:
      - redis_data:/data
    networks:
      - whaticket-network

networks:
  whaticket-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  backend_node_modules:

# Backend local em Node 20 (exigÃªncia Baileys 7) + Postgres/Redis jÃ¡ existentes
services:
  backend:
    image: node:20-bookworm-slim
    container_name: whaticket-backend
    working_dir: /app
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ../backend:/app
      - backend_node_modules:/app/node_modules
    environment:
      - NODE_ENV=development
      - BACKEND_URL=http://localhost:8080
      - FRONTEND_URL=http://localhost:3000
      # NecessÃ¡rio p/ login via Cloudflare (cookies cross-site SameSite=None)
      - COOKIE_SECURE=true
      - ALLOW_ISP_DEMO=false
      - PRODUCT_MODE=owner_saas
      - GERENCIANET_WEBHOOK_SECRET=dev-webhook-secret-change-in-prod
      - WHATSAPP_CLOUD_ENABLED=false
      - PROXY_PORT=8080
      - PORT=8080
      - DB_DIALECT=postgres
      - DB_HOST=whaticket-postgres
      - DB_PORT=5432
      - DB_USER=whaticket
      - DB_PASS=whaticket
      - DB_NAME=whaticket
      - JWT_SECRET=kZaOTd+YZpjRUyyuQUpigJaEMk4vcW4YOymKPZX0Ts8=
      - JWT_REFRESH_SECRET=dBSXqFg9TaNUEDXVp6fhMTRLBysP+j2DSqf7+raxD3A=
      - REDIS_URI=redis://:whaticket@whaticket-redis:6379
      - REDIS_OPT_LIMITER_MAX=1
      - REDIS_OPT_LIMITER_DURATION=3000
      - USER_LIMIT=10000
      - CONNECTIONS_LIMIT=100000
      - CLOSED_SEND_BY_ME=true
    command:
      - node
      - --max-old-space-size=3072
      - dist/server.js
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 40s
    mem_limit: 3584m
    depends_on:
      - postgres
      - redis
    networks:
      - whaticket-network

  postgres:
    image: postgres:14-alpine
    container_name: whaticket-postgres
    restart: always
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=whaticket
      - POSTGRES_PASSWORD=whaticket
      - POSTGRES_DB=whaticket
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U whaticket -d whaticket"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - whaticket-network

  redis:
    image: redis:6-alpine
    container_name: whaticket-redis
    restart: always
    ports:
      - "6389:6379"
    command: redis-server --requirepass whaticket
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "whaticket", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - whaticket-network

networks:
  whaticket-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  backend_node_modules:
